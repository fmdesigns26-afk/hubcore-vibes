name: Patch HubCore Vibes site

on:
  push:
    paths:
      - '.github/workflows/patch-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch site content
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s, _ = re.subn(
              r'\n<section class="section creators reveal">.*?</section>\n\n(?=<section id="founder")',
              '\n',
              s,
              count=1,
              flags=re.S,
          )

          old_img = 'src="assets/founder.jpg" alt="Yutani Pretorius — Founder, Creator, Developer and Owner of HubCore Vibes" loading="eager" decoding="async"'
          new_img = 'src="assets/founder.jpg?v=20260831c" alt="Yutani Pretorius — Founder, Creator, Developer and Owner of HubCore Vibes" loading="eager" decoding="async" onerror="this.onerror=null;this.src=\'assets/founder-yutani.svg?v=20260831c\'"'
          if old_img in s:
              s = s.replace(old_img, new_img, 1)

          # Load the live layer explicitly rather than via document.write.
          if 'live-fixes.css?v=20260831c' not in s:
              s = s.replace(
                  '<link rel="stylesheet" href="styles.css">',
                  '<link rel="stylesheet" href="styles.css?v=20260831c">\n<link rel="stylesheet" href="live-fixes.css?v=20260831c">',
                  1,
              )

          old_scripts = '<script src="platform-api.js"></script><script src="script.js"></script>'
          new_scripts = '<script src="platform-api.js?v=20260831c"></script><script src="live-community.js?v=20260831c"></script><script src="script.js?v=20260831c"></script>'
          if old_scripts in s:
              s = s.replace(old_scripts, new_scripts, 1)
          else:
              s = re.sub(
                  r'<script src="platform-api\.js(?:\?[^\"]*)?"></script>\s*<script src="(?:live-community\.js(?:\?[^\"]*)?"></script>\s*)?<script src="script\.js(?:\?[^\"]*)?"></script>',
                  new_scripts,
                  s,
                  count=1,
              )

          p.write_text(s, encoding='utf-8')

          Path('_redirects').write_text('', encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html _redirects
          git diff --cached --quiet && exit 0
          git commit -m 'Load live community layer directly and bust browser cache'
          git push
