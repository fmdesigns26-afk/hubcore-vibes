name: Validate HubCore Vibes site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required production files
        run: |
          test -f index.html
          test -f platform-api.js
          test -f live-community.js
          test -f community-stability.js
          test -f founder-mode.js
          test -f early-access-live.js
          test -f platform-health.js
          test -f functions/api/community.js
          test -f functions/api/platform.js
          test -f functions/api/early-access.js

      - name: Validate browser JavaScript syntax
        run: |
          node --check platform-api.js
          node --check live-community.js
          node --check community-stability.js
          node --check founder-mode.js
          node --check early-access-live.js
          node --check platform-health.js
          node --check site-polish.js
          node --check reality-live.js

      - name: Validate Cloudflare Function syntax
        run: |
          for file in functions/api/*.js; do
            cp "$file" /tmp/check.mjs
            node --check /tmp/check.mjs
          done

      - name: Site validation complete
        run: echo "HubCore Vibes production files passed validation."
